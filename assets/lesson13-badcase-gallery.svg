<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AI做PPT四大常见翻车现场</title>
  <desc id="desc">极简展示死图、字密、看不清与瞎编数据四大高频翻车现场</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 顶部大标题 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="0" y="0" width="1200" height="84" rx="20" fill="#ffffff" stroke="#f1f5f9"/>
    <rect x="40" y="20" width="8" height="44" rx="4" fill="#ef4444"/>
    <text x="60" y="52" font-size="26" font-weight="900" fill="#0f172a">⚠️ 警惕！AI 做 PPT 最容易翻车的 4 个现场</text>
    <rect x="990" y="24" width="160" height="36" rx="18" fill="#fef2f2" stroke="#fecaca"/>
    <text x="1070" y="47" text-anchor="middle" font-size="14" font-weight="900" fill="#dc2626">不改直接交 = 0分</text>
  </g>

  <!-- 4 个大卡片 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    
    <!-- 翻车1: 死图 -->
    <g transform="translate(40, 105)">
      <rect width="260" height="380" rx="16" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#shadow)"/>
      <rect width="260" height="46" rx="16" fill="#fef2f2"/>
      <rect y="26" width="260" height="20" fill="#fef2f2"/>
      <text x="130" y="30" text-anchor="middle" font-size="18" font-weight="900" fill="#dc2626">❌ 翻车一：是张“死图”</text>

      <!-- 画面 -->
      <g transform="translate(20, 65)">
        <rect width="220" height="150" rx="8" fill="#f1f5f9" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4"/>
        <text x="110" y="50" text-anchor="middle" font-size="14" font-weight="bold" fill="#64748b">整张幻灯片是一张图</text>
        <!-- 4个拉手角点 -->
        <circle cx="0" cy="0" r="6" fill="#2563eb"/>
        <circle cx="220" cy="0" r="6" fill="#2563eb"/>
        <circle cx="0" cy="150" r="6" fill="#2563eb"/>
        <circle cx="220" cy="150" r="6" fill="#2563eb"/>
        
        <rect x="15" y="75" width="190" height="46" rx="8" fill="#ef4444"/>
        <text x="105" y="104" text-anchor="middle" font-size="15" font-weight="900" fill="#ffffff">错别字根本改不了！</text>
      </g>

      <!-- 症状与对策 -->
      <g transform="translate(20, 235)">
        <text x="0" y="24" font-size="15" font-weight="900" fill="#991b1b">表现：点哪都只能拖图片</text>
        <text x="0" y="54" font-size="14" font-weight="700" fill="#64748b">后果：一处错，全页作废重做</text>
        
        <rect y="78" width="220" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <text x="110" y="108" text-anchor="middle" font-size="14" font-weight="900" fill="#15803d">✅ 必须能选中文本框！</text>
      </g>
    </g>

    <!-- 翻车2: 字太多 -->
    <g transform="translate(326, 105)">
      <rect width="260" height="380" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2" filter="url(#shadow)"/>
      <rect width="260" height="46" rx="16" fill="#fff7ed"/>
      <rect y="26" width="260" height="20" fill="#fff7ed"/>
      <text x="130" y="30" text-anchor="middle" font-size="18" font-weight="900" fill="#ea580c">❌ 翻车二：字密密麻麻</text>

      <!-- 画面 -->
      <g transform="translate(20, 65)">
        <rect width="220" height="150" rx="8" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
        <text x="14" y="26" font-size="12" font-weight="bold" fill="#9a3412">密密麻麻全是小字（Word搬家）</text>
        <g fill="#cbd5e1">
          <rect x="14" y="38" width="190" height="6" rx="3"/>
          <rect x="14" y="48" width="180" height="6" rx="3"/>
          <rect x="14" y="58" width="190" height="6" rx="3"/>
          <rect x="14" y="68" width="170" height="6" rx="3"/>
        </g>
        <rect x="15" y="85" width="190" height="46" rx="8" fill="#f97316"/>
        <text x="105" y="114" text-anchor="middle" font-size="15" font-weight="900" fill="#ffffff">观众看 3 秒直接睡着！</text>
      </g>

      <!-- 症状与对策 -->
      <g transform="translate(20, 235)">
        <text x="0" y="24" font-size="15" font-weight="900" fill="#9a3412">表现：一页塞了 200 字</text>
        <text x="0" y="54" font-size="14" font-weight="700" fill="#64748b">后果：上台变“照屏念字”</text>
        
        <rect y="78" width="220" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <text x="110" y="108" text-anchor="middle" font-size="14" font-weight="900" fill="#15803d">✅ 每页只讲 3 条短句！</text>
      </g>
    </g>

    <!-- 翻车3: 配色烂 -->
    <g transform="translate(612, 105)">
      <rect width="260" height="380" rx="16" fill="#ffffff" stroke="#e9d5ff" stroke-width="2" filter="url(#shadow)"/>
      <rect width="260" height="46" rx="16" fill="#faf5ff"/>
      <rect y="26" width="260" height="20" fill="#faf5ff"/>
      <text x="130" y="30" text-anchor="middle" font-size="18" font-weight="900" fill="#9333ea">❌ 翻车三：完全看不清</text>

      <!-- 画面 -->
      <g transform="translate(20, 65)">
        <rect width="220" height="150" rx="8" fill="#fef08a" stroke="#d8b4fe" stroke-width="2"/>
        <rect x="20" y="25" width="180" height="30" rx="4" fill="#fef9c3"/>
        <text x="110" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">浅黄底配白字 (瞎眼)</text>
        
        <rect x="15" y="85" width="190" height="46" rx="8" fill="#a855f7"/>
        <text x="105" y="114" text-anchor="middle" font-size="15" font-weight="900" fill="#ffffff">投影仪上一片大反光！</text>
      </g>

      <!-- 症状与对策 -->
      <g transform="translate(20, 235)">
        <text x="0" y="24" font-size="15" font-weight="900" fill="#6b21a8">表现：花里胡哨、对比度差</text>
        <text x="0" y="54" font-size="14" font-weight="700" fill="#64748b">后果：坐后排的同学看不见</text>
        
        <rect y="78" width="220" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <text x="110" y="108" text-anchor="middle" font-size="14" font-weight="900" fill="#15803d">✅ 白底黑字深蓝才清晰！</text>
      </g>
    </g>

    <!-- 翻车4: 瞎编数据 -->
    <g transform="translate(898, 105)">
      <rect width="262" height="380" rx="16" fill="#ffffff" stroke="#fbcfe8" stroke-width="2" filter="url(#shadow)"/>
      <rect width="262" height="46" rx="16" fill="#fdf2f8"/>
      <rect y="26" width="262" height="20" fill="#fdf2f8"/>
      <text x="131" y="30" text-anchor="middle" font-size="18" font-weight="900" fill="#db2777">❌ 翻车四：AI 瞎编假话</text>

      <!-- 画面 -->
      <g transform="translate(20, 65)">
        <rect width="222" height="150" rx="8" fill="#ffffff" stroke="#f472b6" stroke-width="2"/>
        <text x="14" y="28" font-size="12" font-weight="bold" fill="#be185d">凭空捏造校规与金额：</text>
        <rect x="14" y="36" width="194" height="22" rx="3" fill="#fce7f3"/>
        <text x="20" y="51" font-size="10.5" font-weight="bold" fill="#9d174d">“依据2026校规罚款5000元”</text>
        
        <rect x="15" y="85" width="192" height="46" rx="8" fill="#e11d48"/>
        <text x="111" y="114" text-anchor="middle" font-size="15" font-weight="900" fill="#ffffff">老师一问当场穿帮挂科！</text>
      </g>

      <!-- 症状与对策 -->
      <g transform="translate(20, 235)">
        <text x="0" y="24" font-size="15" font-weight="900" fill="#9d174d">表现：AI 自作聪明编造事实</text>
        <text x="0" y="54" font-size="14" font-weight="700" fill="#64748b">后果：信息造假、严重事故</text>
        
        <rect y="78" width="222" height="48" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <text x="111" y="108" text-anchor="middle" font-size="14" font-weight="900" fill="#15803d">✅ 没给的信息坚决删除！</text>
      </g>
    </g>

  </g>
</svg>
