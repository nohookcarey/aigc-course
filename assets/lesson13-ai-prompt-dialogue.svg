<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">AI工具提示词驱动与下载实操</title>
  <desc id="desc">展示向AI发提示词锁住5页并务必点击下载PPTX文件保存到本地</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="1200" height="460" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 顶部标题 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="0" y="0" width="1200" height="80" rx="20" fill="#ffffff" stroke="#f1f5f9"/>
    <rect x="40" y="18" width="8" height="44" rx="4" fill="#6366f1"/>
    <text x="60" y="48" font-size="24" font-weight="900" fill="#0f172a">🤖 实操：在 AI 对话框发提示词，生成后点下载</text>
    <rect x="980" y="22" width="180" height="36" rx="18" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="1070" y="45" text-anchor="middle" font-size="14" font-weight="900" fill="#4f46e5">必须存到电脑本地</text>
  </g>

  <!-- 对话窗口 -->
  <g transform="translate(60, 100)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect width="1080" height="330" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- 窗口顶栏 -->
    <rect width="1080" height="36" rx="16" fill="#f8fafc"/>
    <rect y="20" width="1080" height="16" fill="#f8fafc"/>
    <circle cx="24" cy="18" r="5" fill="#ef4444"/>
    <circle cx="40" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="56" cy="18" r="5" fill="#10b981"/>
    <text x="80" y="23" font-size="12" font-weight="bold" fill="#64748b">AI PPT 助手</text>

    <!-- 学生发送的气泡 -->
    <g transform="translate(160, 55)">
      <rect width="870" height="95" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
      <circle cx="-35" cy="25" r="18" fill="#3b82f6"/>
      <text x="-35" y="31" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">你</text>
      
      <text x="20" y="30" font-size="15" font-weight="900" fill="#1e40af">向 AI 发送提示词（直接复制）：</text>
      <text x="20" y="56" font-size="13.5" font-weight="700" fill="#1e3a8a">
        “请为高职新生生成可下载、文字可编辑的 5 页 PPTX，主题《校园信息安全提醒》。恰好 5 页！
      </text>
      <text x="20" y="78" font-size="13.5" font-weight="900" fill="#dc2626">
        【红线】：每页只要3条短句！不增加虚假处罚数据！不要感谢页！不要做成整页死图！”
      </text>
    </g>

    <!-- AI 回复并给出下载按钮 -->
    <g transform="translate(80, 175)">
      <rect width="950" height="130" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
      <circle cx="-35" cy="25" r="18" fill="#6366f1"/>
      <text x="-35" y="31" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">AI</text>

      <text x="24" y="32" font-size="15" font-weight="900" fill="#312e81">AI 已经生成完毕！</text>
      <text x="24" y="56" font-size="13.5" font-weight="bold" fill="#475569">恰好 5 页，每个字都可以点选修改。请点击右侧按钮下载：</text>

      <!-- 超大下载按钮 -->
      <g transform="translate(24, 68)">
        <rect width="320" height="48" rx="8" fill="#4f46e5"/>
        <text x="160" y="30" text-anchor="middle" font-size="16" font-weight="900" fill="#ffffff">⬇️ 点击下载 PPTX 文件 (2.4MB)</text>
      </g>

      <!-- 箭头与醒目标注 -->
      <g transform="translate(370, 72)">
        <rect width="550" height="42" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
        <text x="20" y="27" font-size="15" font-weight="900" fill="#b91c1c">⚠️ 关键动作：必须点下载保存到电脑！严禁只在网页上截个图！</text>
      </g>
    </g>

  </g>
</svg>
