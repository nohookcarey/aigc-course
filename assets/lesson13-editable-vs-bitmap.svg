<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">一眼辨真伪：真PPT与死图对比</title>
  <desc id="desc">双击文字进入编辑并尝试修改；仅出现控制点不能判断可编辑性</desc>
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="520" rx="20" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- 顶部标题 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="0" y="0" width="1200" height="84" rx="20" fill="#ffffff" stroke="#f1f5f9"/>
    <rect x="40" y="20" width="8" height="44" rx="4" fill="#2563eb"/>
    <text x="60" y="52" font-size="26" font-weight="900" fill="#0f172a">🖱️ 试改一个字：区分原生文字与整页图片</text>
    <rect x="990" y="24" width="170" height="36" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="1075" y="47" text-anchor="middle" font-size="14" font-weight="900" fill="#1d4ed8">下载后必须第一步测试</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    
    <!-- 左侧：死图（伪PPT） -->
    <g transform="translate(50, 110)">
      <rect width="520" height="370" rx="16" fill="#ffffff" stroke="#fecaca" stroke-width="2" filter="url(#shadow)"/>
      <rect width="520" height="46" rx="16" fill="#fef2f2"/>
      <rect y="26" width="520" height="20" fill="#fef2f2"/>
      <text x="30" y="30" font-size="18" font-weight="900" fill="#dc2626">❌ 整页图片：不能直接修改文字</text>
      <text x="490" y="30" text-anchor="end" font-size="14" font-weight="900" fill="#b91c1c">【不能交】</text>

      <!-- 模拟幻灯片 -->
      <g transform="translate(25, 65)">
        <rect width="470" height="180" rx="8" fill="#f8fafc" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4"/>
        <!-- 8个控制锚点 -->
        <circle cx="0" cy="0" r="6" fill="#2563eb"/>
        <circle cx="235" cy="0" r="6" fill="#2563eb"/>
        <circle cx="470" cy="0" r="6" fill="#2563eb"/>
        <circle cx="0" cy="90" r="6" fill="#2563eb"/>
        <circle cx="470" cy="90" r="6" fill="#2563eb"/>
        <circle cx="0" cy="180" r="6" fill="#2563eb"/>
        <circle cx="235" cy="180" r="6" fill="#2563eb"/>
        <circle cx="470" cy="180" r="6" fill="#2563eb"/>

        <text x="235" y="70" text-anchor="middle" font-size="22" font-weight="900" fill="#64748b">校园信息安全提醒</text>
        <text x="235" y="105" text-anchor="middle" font-size="15" fill="#94a3b8">写在图片里面的字，无法选中</text>
        
        <!-- 鼠标点击提示 -->
        <rect x="75" y="125" width="320" height="40" rx="20" fill="#ef4444"/>
        <text x="235" y="150" text-anchor="middle" font-size="15" font-weight="900" fill="#ffffff">🖱️ 只能选中整图，不能直接改字</text>
      </g>

      <!-- 大红警示 -->
      <g transform="translate(25, 265)">
        <rect width="470" height="75" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
        <text x="20" y="32" font-size="16" font-weight="900" fill="#991b1b">🚨 致命后果：</text>
        <text x="20" y="58" font-size="14" font-weight="700" fill="#dc2626">不能直接改字时，需重建文本框或重新导出</text>
      </g>
    </g>

    <!-- 右侧：真可编辑 PPT -->
    <g transform="translate(630, 110)">
      <rect width="520" height="370" rx="16" fill="#ffffff" stroke="#86efac" stroke-width="2" filter="url(#shadow)"/>
      <rect width="520" height="46" rx="16" fill="#f0fdf4"/>
      <rect y="26" width="520" height="20" fill="#f0fdf4"/>
      <text x="30" y="30" font-size="18" font-weight="900" fill="#15803d">✅ 原生文本：进入编辑后可以修改</text>
      <text x="490" y="30" text-anchor="end" font-size="14" font-weight="900" fill="#166534">【合格交作业】</text>

      <!-- 模拟幻灯片 -->
      <g transform="translate(25, 65)">
        <rect width="470" height="180" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
        
        <!-- 独立文本框高亮 -->
        <g transform="translate(25, 25)">
          <rect width="420" height="50" rx="4" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 3"/>
          <text x="15" y="34" font-size="22" font-weight="900" fill="#1e293b">校园信息安全提醒</text>
          <!-- 闪烁光标 -->
          <line x1="205" y1="12" x2="205" y2="40" stroke="#2563eb" stroke-width="3"/>
          <text x="310" y="32" font-size="13" font-weight="900" fill="#2563eb">| 光标在闪烁</text>
        </g>

        <!-- 鼠标点击提示 -->
        <rect x="75" y="105" width="320" height="40" rx="20" fill="#16a34a"/>
        <text x="235" y="130" text-anchor="middle" font-size="15" font-weight="900" fill="#ffffff">🖱️ 双击进入正文编辑，再试改一个字</text>
      </g>

      <!-- 大绿达标 -->
      <g transform="translate(25, 265)">
        <rect width="470" height="75" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
        <text x="20" y="32" font-size="16" font-weight="900" fill="#14532d">✨ 合格表现：</text>
        <text x="20" y="58" font-size="14" font-weight="700" fill="#15803d">能改文字、调整字号，再检查放映可读性</text>
      </g>
    </g>

  </g>
</svg>
