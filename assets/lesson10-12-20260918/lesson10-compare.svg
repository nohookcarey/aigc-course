<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="734" viewBox="0 0 1200 734"><rect width="1200" height="734" fill="#f3f6fb"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="50" y="67" font-size="34" font-weight="700" fill="#152c49">版本变化：分类之后，仍要回查原句</text><text x="50" y="115" font-size="23" fill="#52647b">概念示意图 · 课堂模拟活动方案 · 每项记录版本、章节和原句</text><rect x="45" y="155" width="1110" height="100" rx="14" fill="white" stroke="#d1dce9"/><text x="68" y="194" font-size="25" font-weight="700" fill="#1c5b86">新增</text><text x="320" y="193" font-size="23" fill="#24364a">v3：无第7节 → v4：新增天气预案</text><text x="320" y="230" font-size="22" fill="#52647b">记录新增内容；恢复时间仍未明确</text><rect x="45" y="271" width="1110" height="100" rx="14" fill="white" stroke="#d1dce9"/><text x="68" y="310" font-size="25" font-weight="700" fill="#1c5b86">删除</text><text x="320" y="309" font-size="23" fill="#24364a">v3：不接受现场报名 → v4：无对应句</text><text x="320" y="346" font-size="22" fill="#52647b">仅确认句子删除，不能断言现场报名已获批准</text><rect x="45" y="387" width="1110" height="100" rx="14" fill="white" stroke="#d1dce9"/><text x="68" y="426" font-size="25" font-weight="700" fill="#1c5b86">修改</text><text x="320" y="425" font-size="23" fill="#24364a">v3：预算上限800元 → v4：1200元</text><text x="320" y="462" font-size="22" fill="#52647b">复算600+200与900+300；核对金额变化</text><rect x="45" y="503" width="1110" height="100" rx="14" fill="white" stroke="#d1dce9"/><text x="68" y="542" font-size="25" font-weight="700" fill="#1c5b86">仅格式变化</text><text x="320" y="541" font-size="23" fill="#24364a">第6节文字相同：正文样式 → 标题2</text><text x="320" y="578" font-size="22" fill="#52647b">必须打开实际DOCX检查样式，文字标注不等于实测</text><text x="50" y="689" font-size="23" fill="#274863">保留原文件；报告列出可能影响与待确认项，不代替负责人审批。</text></g></svg>