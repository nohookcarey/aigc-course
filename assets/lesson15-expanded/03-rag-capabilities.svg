<svg xmlns="http://www.w3.org/2000/svg" width="800" height="920" viewBox="0 0 800 920"><rect width="800" height="920" rx="28" fill="#f4f7ff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="65" font-size="40" font-weight="700" fill="#17345f">RAG能做哪些事？</text><text x="40" y="110" font-size="32" fill="#52617c">概念示意 · 两份资料，一个任务</text><rect x="25" y="145" width="750" height="138" rx="18" fill="white" stroke="#c9d6ee" stroke-width="2"/><circle cx="63" cy="185" r="22" fill="#3157d5"/><text x="63" y="195" text-anchor="middle" font-size="28" fill="white">1</text><text x="105" y="189" font-size="36" font-weight="700" fill="#17345f">查通知</text><text x="105" y="228" font-size="36" fill="#33435f">活动需要提前多久申请？</text><text x="105" y="267" font-size="36" fill="#33435f">输出：答案和资料出处</text><rect x="25" y="305" width="750" height="138" rx="18" fill="white" stroke="#c9d6ee" stroke-width="2"/><circle cx="63" cy="345" r="22" fill="#7049b3"/><text x="63" y="355" text-anchor="middle" font-size="28" fill="white">2</text><text x="105" y="349" font-size="36" font-weight="700" fill="#17345f">合并资料</text><text x="105" y="388" font-size="36" fill="#33435f">申请说明＋设备清单</text><text x="105" y="427" font-size="36" fill="#33435f">输出：一页活动准备清单</text><rect x="25" y="465" width="750" height="138" rx="18" fill="white" stroke="#c9d6ee" stroke-width="2"/><circle cx="63" cy="505" r="22" fill="#3157d5"/><text x="63" y="515" text-anchor="middle" font-size="28" fill="white">3</text><text x="105" y="509" font-size="36" font-weight="700" fill="#17345f">问说明书</text><text x="105" y="548" font-size="36" fill="#33435f">某个实训设备怎样操作？</text><text x="105" y="587" font-size="36" fill="#33435f">输出：步骤和对应原文</text><rect x="25" y="625" width="750" height="138" rx="18" fill="white" stroke="#c9d6ee" stroke-width="2"/><circle cx="63" cy="665" r="22" fill="#7049b3"/><text x="63" y="675" text-anchor="middle" font-size="28" fill="white">4</text><text x="105" y="669" font-size="36" font-weight="700" fill="#17345f">说明没有找到</text><text x="105" y="708" font-size="36" fill="#33435f">资料没提供设备租金</text><text x="105" y="747" font-size="36" fill="#33435f">输出：资料未说明费用</text><text x="40" y="875" font-size="30" fill="#7049b3">先学会操作，再用自己的资料练习。</text></g></svg>