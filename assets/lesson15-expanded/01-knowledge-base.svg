<svg xmlns="http://www.w3.org/2000/svg" width="800" height="920" viewBox="0 0 800 920"><rect width="800" height="920" rx="28" fill="#f4f7ff"/><g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="40" y="65" font-size="40" font-weight="700" fill="#17345f">知识库：资料书包</text><text x="40" y="110" font-size="32" fill="#52617c">概念示意 · 两份资料，一个任务</text><rect x="25" y="145" width="750" height="138" rx="18" fill="white" stroke="#c9d6ee" stroke-width="2"/><circle cx="63" cy="185" r="22" fill="#3157d5"/><text x="63" y="195" text-anchor="middle" font-size="28" fill="white">1</text><text x="105" y="189" font-size="36" font-weight="700" fill="#17345f">先放资料</text><text x="105" y="228" font-size="36" fill="#33435f">申请说明：时间和人数</text><text x="105" y="267" font-size="36" fill="#33435f">设备清单：投影和话筒</text><rect x="25" y="305" width="750" height="138" rx="18" fill="white" stroke="#c9d6ee" stroke-width="2"/><circle cx="63" cy="345" r="22" fill="#7049b3"/><text x="63" y="355" text-anchor="middle" font-size="28" fill="white">2</text><text x="105" y="349" font-size="36" font-weight="700" fill="#17345f">再提问题</text><text x="105" y="388" font-size="36" fill="#33435f">活动室有几支话筒？</text><text x="105" y="427" font-size="36" fill="#33435f">软件去资料中找有关内容</text><rect x="25" y="465" width="750" height="138" rx="18" fill="white" stroke="#c9d6ee" stroke-width="2"/><circle cx="63" cy="505" r="22" fill="#3157d5"/><text x="63" y="515" text-anchor="middle" font-size="28" fill="white">3</text><text x="105" y="509" font-size="36" font-weight="700" fill="#17345f">得到回答</text><text x="105" y="548" font-size="36" fill="#33435f">设备清单写着：2支话筒</text><text x="105" y="587" font-size="36" fill="#33435f">答案保留资料中的数字</text><rect x="25" y="625" width="750" height="138" rx="18" fill="white" stroke="#c9d6ee" stroke-width="2"/><circle cx="63" cy="665" r="22" fill="#7049b3"/><text x="63" y="675" text-anchor="middle" font-size="28" fill="white">4</text><text x="105" y="669" font-size="36" font-weight="700" fill="#17345f">回到原文</text><text x="105" y="708" font-size="36" fill="#33435f">点开设备清单的出处</text><text x="105" y="747" font-size="36" fill="#33435f">看看原文是不是这样写的</text><text x="40" y="875" font-size="30" fill="#7049b3">先学会操作，再用自己的资料练习。</text></g></svg>