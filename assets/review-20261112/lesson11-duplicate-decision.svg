<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="dec-title dec-desc">
  <title id="dec-title">同金额记录的核对与保留</title>
  <desc id="dec-desc">同日同金额只是疑点；保留原始记录，补充依据后由授权人员按制度处理</desc>
  <defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#64748b"/></marker>
    <filter id="d-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1200" height="420" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部标题 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="45" y="44" font-size="20" font-weight="800" fill="#0f172a">⚖️ 两条记录相同：先保留，再按依据处理</text>
    <text x="45" y="68" font-size="13" fill="#64748b">课堂模拟：金额相同不等于重复；记录真实也不等于符合报销条件</text>
  </g>

  <!-- 决策流 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" transform="translate(45, 95)">

    <!-- 起点：发现两笔同金额同项目凭证 -->
    <g transform="translate(0, 70)">
      <rect width="250" height="120" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" filter="url(#d-shadow)"/>
      <rect x="16" y="16" width="218" height="28" rx="6" fill="#bfdbfe"/>
      <text x="125" y="35" text-anchor="middle" font-size="13" font-weight="800" fill="#1e40af">发现两条记录高度吻合</text>
      <text x="24" y="68" font-size="12" fill="#1e3a8a">• 记录2：2026-09-10 打印 12元</text>
      <text x="24" y="90" font-size="12" fill="#1e3a8a">• 记录4：2026-09-10 打印 12元</text>
      <text x="24" y="112" font-size="11" font-weight="700" fill="#2563eb">问：能直接删掉一条吗？</text>
    </g>

    <!-- 连线到分支判断 -->
    <path d="M 250 130 L 330 130" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- 分支判断菱形区域 -->
    <g transform="translate(330, 60)">
      <polygon points="120,0 240,70 120,140 0,70" fill="#ffffff" stroke="#3b82f6" stroke-width="2" filter="url(#d-shadow)"/>
      <text x="120" y="62" text-anchor="middle" font-size="13" font-weight="800" fill="#0f172a">是否有补充证据？</text>
      <text x="120" y="82" text-anchor="middle" font-size="11" fill="#64748b">（原始凭据 / 经办说明）</text>
    </g>

    <!-- 分支 1：向上（有独立凭证，真实发生两次） -->
    <path d="M 450 60 L 450 15 L 590 15" fill="none" stroke="#22c55e" stroke-width="2"/>
    <text x="460" y="32" font-size="12" font-weight="700" fill="#15803d">支持分别发生</text>

    <g transform="translate(590, -10)">
      <rect width="520" height="70" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
      <text x="20" y="28" font-size="13" font-weight="800" fill="#166534">✅ 保留两条独立记录，交授权人员按制度审核</text>
      <text x="20" y="50" font-size="12" fill="#15803d">例如两次打印有各自凭据，可说明合计24元；不据此认定可报销。</text>
    </g>

    <!-- 分支 2：向中（未提供证据，尚待核实） -->
    <path d="M 570 130 L 590 130" fill="none" stroke="#eab308" stroke-width="2"/>

    <g transform="translate(590, 85)">
      <rect width="520" height="90" rx="10" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
      <text x="20" y="28" font-size="13" font-weight="800" fill="#854d0e">⚠️ 暂无补充依据：备注“疑似重复，待查凭证”，保留两行</text>
      <text x="20" y="50" font-size="12" fill="#713f12">• 四条原始记录合计66.50元，保留原始总额与记录对应关系。</text>
      <text x="20" y="70" font-size="12" fill="#713f12">• 假设扣除其中12元，试算54.50元；它不是已批准金额。</text>
    </g>

    <!-- 分支 3：向下（查实重复报销或误录入） -->
    <path d="M 450 200 L 450 245 L 590 245" fill="none" stroke="#ef4444" stroke-width="2"/>
    <text x="460" y="235" font-size="12" font-weight="700" fill="#dc2626">依据确认重复</text>

    <g transform="translate(590, 205)">
      <rect width="520" height="80" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
      <text x="20" y="26" font-size="13" font-weight="800" fill="#991b1b">🛑 由授权人员按适用制度处理，记录理由与依据</text>
      <text x="20" y="48" font-size="12" fill="#b91c1c">本课只保留原始行与核对说明，不演示真实财务系统的核减或冲销。</text>
      <text x="20" y="68" font-size="11" font-weight="700" fill="#dc2626">保留原件，在副本记录调整；真实业务以实际制度和权限为准。</text>
    </g>

  </g>
</svg>