<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">从PPT生成到可编辑文件的操作示意</title><desc id="desc">生成文件、打开选择文字、修改一处、保存后重开；示意图不表示软件已经执行。</desc>
<rect width="1200" height="460" rx="20" fill="#f8fafc" stroke="#d9e2f0"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" fill="#173159"><text x="42" y="55" font-size="30" font-weight="700">从生成到可编辑文件</text><text x="42" y="91" font-size="18" fill="#59687b">操作示意 · 五页是本课任务要求，实际结果要打开文件查看</text></g>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif">
<rect x="42" y="145" width="350" height="210" rx="16" fill="white" stroke="#a6bcdf"/><text x="62" y="189" font-size="23" font-weight="700" fill="#244b91">1 取得实际文件</text><text x="62" y="246" font-size="19" fill="#28394f">要求返回可打开的PPTX</text><text x="62" y="288" font-size="18" fill="#526079">聊天中的文字不能代替文件</text><path d="M399 248 L418 248 L411 242 M418 248 L411 254" fill="none" stroke="#7e96bb" stroke-width="3"/><rect x="424" y="145" width="350" height="210" rx="16" fill="white" stroke="#a6bcdf"/><text x="444" y="189" font-size="23" font-weight="700" fill="#244b91">2 打开并选择文字</text><text x="444" y="246" font-size="19" fill="#28394f">在演示软件中选中一句话</text><text x="444" y="288" font-size="18" fill="#526079">观察能否修改单独的文字</text><path d="M781 248 L800 248 L793 242 M800 248 L793 254" fill="none" stroke="#7e96bb" stroke-width="3"/><rect x="806" y="145" width="350" height="210" rx="16" fill="white" stroke="#a6bcdf"/><text x="826" y="189" font-size="23" font-weight="700" fill="#244b91">3 修改后保存重开</text><text x="826" y="246" font-size="19" fill="#28394f">改一处标题，再保存并重开</text><text x="826" y="288" font-size="18" fill="#526079">确认页数、文字和版式保留</text></g><text x="42" y="414" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="19" fill="#526079">一页整图无法单独改字时，回到生成要求或使用可编辑模板调整。</text></svg>