<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="fvi-title fvi-desc">
  <title id="fvi-title">数据发现与主观推论的分界线</title>
  <desc id="fvi-desc">清晰划分数据直接支持的事实结论与未经证实的推测假说，建立严谨的商业分析表达规范</desc>
  <defs>
    <filter id="f-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1200" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- 顶部标题 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="45" y="42" font-size="20" font-weight="800" fill="#0f172a">⚖️ 商业分析红线：数据直接发现 vs 主观臆测脑补</text>
    <text x="45" y="66" font-size="13" fill="#64748b">数字能支持到哪里，结论就写到哪里：AI 数据分析中如何做到“有据可查、话留分寸”</text>
  </g>

  <!-- 对比两大展区 -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" transform="translate(45, 95)">
    
    <!-- 左侧：客观数据发现 (允许并提倡) -->
    <g transform="translate(0, 0)">
      <rect width="530" height="250" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5" filter="url(#f-shadow)"/>
      <rect width="530" height="42" rx="12" fill="#dcfce7"/>
      <rect y="24" width="530" height="18" fill="#dcfce7"/>
      <text x="24" y="27" font-size="15" font-weight="800" fill="#15803d">✅ 合格的【数据发现】：100% 由算术与表格事实支持</text>
      
      <g transform="translate(24, 60)">
        <rect width="482" height="74" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
        <text x="16" y="26" font-size="13" font-weight="800" fill="#166534">发现一｜总量比较有明确计算依据：</text>
        <text x="16" y="48" font-size="12" fill="#14532d">“1—3月A产品销售额合计400元，B产品280元，A产品比B产品多120元。”</text>
        <text x="16" y="65" font-size="11" font-weight="700" fill="#15803d">（依据：400 - 280 = 120，数据来源可靠且可验）</text>

        <rect y="88" width="482" height="74" rx="8" fill="#ffffff" stroke="#bbf7d0"/>
        <text x="16" y="114" font-size="13" font-weight="800" fill="#166534">发现二｜时间走势客观陈述并保留并列事实：</text>
        <text x="16" y="136" font-size="12" fill="#14532d">“2月与3月单月两产品销售总额均为240元，并列为一季度销售额最高月份。”</text>
        <text x="16" y="153" font-size="11" font-weight="700" fill="#15803d">（依据：两月总额皆为240元，绝不偏袒某一个月）</text>
      </g>
    </g>

    <!-- 中间分割箭头 -->
    <path d="M 545 125 L 565 125" fill="none" stroke="#cbd5e1" stroke-width="2"/>

    <!-- 右侧：主观过度臆测 (严禁出现) -->
    <g transform="translate(580, 0)">
      <rect width="530" height="250" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5" filter="url(#f-shadow)"/>
      <rect width="530" height="42" rx="12" fill="#fee2e2"/>
      <rect y="24" width="530" height="18" fill="#fee2e2"/>
      <text x="24" y="27" font-size="15" font-weight="800" fill="#b91c1c">❌ 违规的【主观臆测】：脱离数据范围胡乱归因与定性</text>
      
      <g transform="translate(24, 60)">
        <rect width="482" height="74" rx="8" fill="#ffffff" stroke="#fecaca"/>
        <text x="16" y="26" font-size="13" font-weight="800" fill="#991b1b">盲目脑补利润与质量（严重红线）：</text>
        <text x="16" y="48" font-size="12" fill="#7f1d1d">“A产品带来丰厚利润，证明A产品品质卓越、深受市场认可。”</text>
        <text x="16" y="65" font-size="11" font-weight="700" fill="#dc2626">（硬伤：表中完全没有成本、单价和利润率数据！万一A在赔本甩卖？）</text>

        <rect y="88" width="482" height="74" rx="8" fill="#ffffff" stroke="#fecaca"/>
        <text x="16" y="114" font-size="13" font-weight="800" fill="#991b1b">盲目脑补营销因果与管理建议：</text>
        <text x="16" y="136" font-size="12" fill="#7f1d1d">“3月销售额最好是因为开展了春季大促，建议立刻停产B产品。”</text>
        <text x="16" y="153" font-size="11" font-weight="700" fill="#dc2626">（硬伤：2月和3月并列，且无任何活动记录，属于典型的AI幻觉胡诌）</text>
      </g>
    </g>

  </g>
</svg>